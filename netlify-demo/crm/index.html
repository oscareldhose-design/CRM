<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>MAP Operating System · Demo</title>
<link rel="icon" type="image/svg+xml" href="assets/map-mark.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Montserrat:wght@800&display=swap">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f6f1f8; color: #1d1324; font-family: Inter, system-ui, sans-serif; }
  .card { width: min(440px, calc(100vw - 32px)); background: #fff; border-radius: 28px; box-shadow: 0 24px 70px rgba(60, 0, 70, .16); padding: 34px 30px; text-align: center; }
  img { height: 64px; }
  h1 { font: 800 22px/1.3 Montserrat, Inter, sans-serif; color: #8a0a8a; margin: 16px 0 6px; }
  p { color: #5c4b66; margin: 0; line-height: 1.5; }
  .spin { width: 34px; height: 34px; margin: 22px auto 0; border-radius: 50%; border: 4px solid #ecdcf0; border-top-color: #a308a3; animation: s .9s linear infinite; }
  .err .spin { display: none; }
  .err #msg { color: #b0123a; font-weight: 600; }
  @keyframes s { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="card" id="card">
  <img src="assets/map-logo.svg" alt="MAP">
  <h1>MAP Operating System</h1>
  <p id="msg">Starting the demo… The first visit downloads the demo engine (about 18 MB), so it can take a few seconds.</p>
  <div class="spin" role="status" aria-label="Loading"></div>
</div>
<script src="demo/loader.js"></script>
</body>
</html>
